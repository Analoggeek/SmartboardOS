    <rect x="46" y="78" width="30" height="30" rx="8" fill="#8b7dff33" stroke="#8b7dff77"/><path d="M56 86l10 10-4 4-10-10z" fill="#e2dcff"/>
    <rect x="80" y="78" width="30" height="30" rx="8" class="tbtn"/><path d="M89 92h12v5H89z" fill="#a9f0c4"/>

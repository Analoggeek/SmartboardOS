    <circle cx="456" cy="93" r="9" fill="#2563eb"/><circle cx="480" cy="93" r="9" fill="#0f9d6b"/>
    <circle cx="504" cy="93" r="9" fill="#ea8c00"/><circle cx="528" cy="93" r="9" fill="#8b5cf6"/>
    <rect x="552" y="87" width="76" height="12" rx="6" fill="#ffffff14"/><circle cx="580" cy="93" r="9" fill="#eef0ff"/>

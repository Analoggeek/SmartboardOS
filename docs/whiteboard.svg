    <rect x="500" y="544" width="34" height="34" rx="9" class="tbtn"/><path d="M510 558h12v5h-12z" fill="#a9f0c4"/>
    <rect x="538" y="544" width="34" height="34" rx="9" class="tbtn"/><path d="M548 552l10 10-6 6-10-10z" fill="#ffb3bf"/>

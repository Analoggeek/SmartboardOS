  <rect x="0" y="624" width="1100" height="76" fill="#12141f"/>
  <g>
    <rect x="14" y="634" width="104" height="52" rx="8" fill="#1c2033" stroke="#ffffff22"/>
    <rect x="20" y="640" width="92" height="34" rx="4" fill="#fff"/><path d="M28 650h20M28 658h32" stroke="#c9d3e6" stroke-width="2"/>

  <line x1="0" y1="116" x2="1100" y2="116" stroke="#ffffff17"/>

  <!-- canvas -->
  <rect x="0" y="116" width="1100" height="508" fill="#ffffff"/>
  <rect x="0" y="116" width="1100" height="508" fill="url(#grid)"/>

  <!-- lesson content -->
  <text x="60" y="178" font-size="30" font-weight="750" fill="#1a2233" letter-spacing="-.8">Fractions — today’s plan</text>
  <path d="M60 196h430" stroke="#8b7dff" stroke-width="5" stroke-linecap="round"/>
  <text x="60" y="240" font-size="16" fill="#33405a">1. What is a numerator?</text>
  <text x="60" y="270" font-size="16" fill="#33405a">2. Draw 3/4 on the grid</text>
  <text x="60" y="300" font-size="16" fill="#33405a">3. Compare 1/2 and 2/3</text>

  <rect x="500" y="196" width="230" height="150" rx="8" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M500 246h230M500 296h230M558 196v150M616 196v150M674 196v150" stroke="#9fb4dd" stroke-width="2"/>
  <rect x="500" y="196" width="172" height="150" fill="#2563eb" opacity=".14"/>
  <text x="615" y="382" font-size="14" fill="#33405a" text-anchor="middle">3/4 shaded</text>

  <path d="M70 420c40-34 70 18 108-8s66 12 96-12 62 6 96-18" fill="none" stroke="#ea8c00" stroke-width="7" stroke-linecap="round"/>
  <path d="M70 462c50-10 92 22 140 2s82 14 128-6" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 500h300" stroke="#0f9d6b" stroke-width="18" stroke-linecap="round" opacity=".33"/>

  <text x="790" y="240" font-size="22" fill="#8b5cf6" font-weight="700">1/2 &lt; 2/3</text>
  <path d="M792 256l120 8" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
  <path d="M830 330c0-25 34-25 34 0 0 14-17 14-17 30M847 384v.5" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g transform="translate(940,330)"><circle r="30" fill="#fff2b8"/><circle cx="-10" cy="-6" r="3.2" fill="#3a2a10"/><circle cx="10" cy="-6" r="3.2" fill="#3a2a10"/><path d="M-12 8q12 11 24 0" fill="none" stroke="#3a2a10" stroke-width="3" stroke-linecap="round"/></g>
  <text x="940" y="388" font-size="11" fill="#6f7695" text-anchor="middle">sticker</text>

  <!-- selection bbox -->
  <rect x="492" y="188" width="246" height="166" fill="none" stroke="#6b7cff" stroke-width="1.6" stroke-dasharray="7 6"/>
  <rect x="732" y="348" width="12" height="12" fill="#6b7cff"/>


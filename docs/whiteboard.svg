    <rect x="716" y="83" width="54" height="22" rx="6" class="tbtn"/><text x="724" y="98" font-size="10" fill="#c9d3e6">page 2/5</text>
    <rect x="900" y="83" width="86" height="22" rx="6" class="tbtn"/><text x="910" y="98" font-size="10" fill="#c9d3e6">Send to PDF</text>

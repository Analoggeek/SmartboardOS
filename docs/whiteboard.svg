<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7dff"/><stop offset="1" stop-color="#5ad1ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e3e9f7" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .txt{fill:#1a2233}
      .small{font-size:11px;fill:#6f7695}
      .badge{fill:#0e1020;stroke:#ffffff22}
      .tbtn{fill:#ffffff0b;stroke:#ffffff16}
    </style>
  </defs>

  <rect width="1100" height="700" rx="18" fill="#0b0c14"/>
  <text x="18" y="20" font-size="11" fill="#8f97b8">Whiteboard — window chrome (traffic lights show their glyph on hover)</text>

  <!-- window header -->
  <rect x="0" y="28" width="1100" height="42" fill="#0f1120"/>
  <circle cx="20" cy="49" r="6.5" fill="#ff5f57"/><circle cx="42" cy="49" r="6.5" fill="#febc2e"/><circle cx="64" cy="49" r="6.5" fill="#28c840"/>
  <path d="M8 44h5" stroke="#00000055" stroke-width="1.4" stroke-linecap="round" opacity="0"/>
  <rect x="92" y="42" width="14" height="12" rx="2" fill="none" stroke="#8b7dff" stroke-width="1.6"/>
  <text x="114" y="53" font-size="12.5" font-weight="620" fill="#9aa1c0">Whiteboard</text>
  <text x="184" y="53" font-size="10.5" fill="#6f7695">Draw, annotate, teach</text>

    <rect x="240" y="634" width="104" height="52" rx="8" fill="#1c2033" stroke="#ffffff22"/>
    <rect x="246" y="640" width="92" height="34" rx="4" fill="#fff"/><path d="M254 650h24M254 658h16" stroke="#c9d3e6" stroke-width="2"/>
    <text x="248" y="684" font-size="9" fill="#6f7695">3 · 8 obj</text>
    <rect x="352" y="634" width="60" height="52" rx="8" fill="none" stroke="#ffffff2e" stroke-dasharray="5 4"/>
    <path d="M382 654v12M376 660h12" stroke="#9aa1c0" stroke-width="1.8"/>

  <rect x="112" y="578" width="92" height="26" rx="13" class="badge"/><text x="124" y="595" font-size="11" fill="#c9d3e6">page 2 / 5</text>
  <rect x="210" y="578" width="112" height="26" rx="13" class="badge"/><text x="222" y="595" font-size="11" fill="#c9d3e6">14 objects</text>
  <rect x="944" y="574" width="142" height="32" rx="10" class="badge"/>
  <text x="958" y="595" font-size="12" fill="#c9d3e6">−</text><text x="1012" y="595" font-size="11" fill="#c9d3e6" text-anchor="middle">100%</text><text x="1060" y="595" font-size="12" fill="#c9d3e6">+</text>


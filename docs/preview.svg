<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101433"/><stop offset=".55" stop-color="#0a0c19"/><stop offset="1" stop-color="#070810"/>
    </linearGradient>
    <radialGradient id="b1" cx=".15" cy=".05" r=".6"><stop stop-color="#4b2ea8" stop-opacity=".75"/><stop offset="1" stop-color="#4b2ea8" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx=".95" cy=".15" r=".6"><stop stop-color="#0b6d8a" stop-opacity=".7"/><stop offset="1" stop-color="#0b6d8a" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7dff"/><stop offset="1" stop-color="#5ad1ff"/></linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7dff" stop-opacity=".55"/><stop offset="1" stop-color="#151828"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      .card{fill:#151828;fill-opacity:.72;stroke:#ffffff1f;stroke-width:1}
      .muted{fill:#9aa1c0}.dim{fill:#6f7695}.ink{fill:#eef0ff}
      .title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;fill:#9aa1c0;font-weight:650}
      .tile{fill:#ffffff0b;stroke:#ffffff14}
      .small{font-size:11px;fill:#9aa1c0}
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#wall)"/>
  <rect width="1200" height="780" fill="url(#b1)"/>
  <rect width="1200" height="780" fill="url(#b2)"/>

  <!-- top bar -->
  <rect width="1200" height="58" fill="#080a12" fill-opacity=".55"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#ffffff17"/>
  <rect x="18" y="15" width="28" height="28" rx="8" fill="url(#accent)"/>
  <rect x="25" y="21" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/>
  <path d="M29 35h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="56" y="35" class="ink" font-size="15" font-weight="720" letter-spacing="-.3">SmartBoard<tspan fill="#a99cff">OS</tspan></text>
  <rect x="196" y="17" width="300" height="24" rx="12" fill="#ffffff0b" stroke="#ffffff17"/>
  <text x="210" y="33" class="dim" font-size="11.5">Offline-first classroom OS · data stays on device</text>
  <rect x="760" y="16" width="150" height="26" rx="9" fill="#090b16" stroke="#ffffff17"/>
  <circle cx="776" cy="29" r="5" fill="none" stroke="#6f7695" stroke-width="1.6"/>
  <path d="M780 33l4 4" stroke="#6f7695" stroke-width="1.6"/>
  <text x="790" y="33" class="dim" font-size="12">Search…</text>
  <rect x="922" y="19" width="42" height="18" rx="5" fill="#ffffff0b" stroke="#ffffff17"/>
  <text x="931" y="32" class="dim" font-size="10">⌘K</text>
  <text x="1004" y="31" class="ink" font-size="15" font-weight="650" text-anchor="end">9:41 AM</text>
  <text x="1004" y="44" class="dim" font-size="10" text-anchor="end">Wed, 19 Nov</text>
  <circle cx="1044" cy="29" r="14" fill="#ffffff0b" stroke="#ffffff14"/><circle cx="1044" cy="29" r="5" fill="none" stroke="#9aa1c0" stroke-width="1.6"/>
  <circle cx="1084" cy="29" r="14" fill="#ffffff0b" stroke="#ffffff14"/><path d="M1078 24v4h-4m16 6v4h4m-4-14v-4h-4m-6 14h-4v-4" stroke="#9aa1c0" stroke-width="1.5" fill="none"/>
  <circle cx="1124" cy="29" r="14" fill="#ffffff0b" stroke="#ffffff14"/><circle cx="1124" cy="29" r="5" fill="none" stroke="#9aa1c0" stroke-width="1.5"/><circle cx="1124" cy="29" r="1.6" fill="#9aa1c0"/>

  <!-- hero -->
  <rect x="24" y="80" width="756" height="212" rx="18" class="card" filter="url(#soft)"/>
  <text x="52" y="132" class="ink" font-size="30" font-weight="760" letter-spacing="-1">Good morning, <tspan fill="#a99cff">Ms. Sharma.</tspan></text>
  <text x="52" y="160" class="muted" font-size="13">Your whole classroom fits in this tab — draw, present, quiz and explain.</text>
  <text x="52" y="178" class="muted" font-size="13">No accounts, no uploads, no internet needed.</text>
  <rect x="52" y="200" width="156" height="38" rx="11" fill="url(#accent)"/>
  <text x="72" y="223" font-size="12.5" font-weight="650" fill="#0b0b16">Open whiteboard</text>
  <rect x="220" y="200" width="126" height="38" rx="11" fill="#ffffff0f" stroke="#ffffff1c"/>
  <text x="240" y="223" font-size="12.5" fill="#eef0ff">Present a PDF</text>
  <rect x="358" y="200" width="118" height="38" rx="11" fill="#ffffff0f" stroke="#ffffff1c"/>
  <text x="378" y="223" font-size="12.5" fill="#eef0ff">Class tools</text>
  <!-- cube -->
  <g transform="translate(650,140)">
    <rect x="-42" y="-42" width="84" height="84" rx="14" fill="url(#cube)" stroke="#ffffff33" transform="rotate(-8)"/>
    <rect x="-22" y="-42" width="84" height="84" rx="14" fill="#151828" fill-opacity=".9" stroke="#ffffff22" transform="rotate(10)"/>
    <rect x="-32" y="-32" width="64" height="64" rx="12" fill="none" stroke="#ffffff22"/>
    <path d="M-12 -6l14 10-14 10" fill="none" stroke="#eef0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="566" y="214" width="62" height="46" rx="10" fill="#ffffff0b" stroke="#ffffff14"/>
    <text x="597" y="236" class="ink" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text x="597" y="250" class="dim" font-size="8.5" text-anchor="middle">PAGES</text>
    <rect x="636" y="214" width="62" height="46" rx="10" fill="#ffffff0b" stroke="#ffffff14"/>
    <text x="667" y="236" class="ink" font-size="16" font-weight="700" text-anchor="middle">12</text>
    <text x="667" y="250" class="dim" font-size="8.5" text-anchor="middle">NOTES</text>
    <rect x="706" y="214" width="62" height="46" rx="10" fill="#ffffff0b" stroke="#ffffff14"/>
    <text x="737" y="236" class="ink" font-size="16" font-weight="700" text-anchor="middle">8</text>
    <text x="737" y="250" class="dim" font-size="8.5" text-anchor="middle">MEDIA</text>
  </g>

  <!-- quick launch -->
  <rect x="24" y="308" width="756" height="206" rx="18" class="card"/>
  <text x="46" y="334" class="title">Quick launch</text>
  <g>
    <rect x="44" y="348" width="174" height="56" rx="12" class="tile"/><rect x="56" y="360" width="32" height="32" rx="9" fill="#8b7dff33" stroke="#8b7dff55"/><path d="M64 369h16v10H64z" fill="none" stroke="#b9aaff" stroke-width="1.6"/><text x="98" y="375" class="ink" font-size="12.5" font-weight="640">Whiteboard</text><text x="98" y="389" class="small">Draw, annotate, teach</text>
    <rect x="230" y="348" width="174" height="56" rx="12" class="tile"/><rect x="242" y="360" width="32" height="32" rx="9" fill="#ff8f6b33" stroke="#ff8f6b55"/><path d="M252 368h12l4 4v12h-16z" fill="none" stroke="#ffb49c" stroke-width="1.5"/><text x="284" y="375" class="ink" font-size="12.5" font-weight="640">PDF Studio</text><text x="284" y="389" class="small">Present &amp; annotate</text>
    <rect x="416" y="348" width="174" height="56" rx="12" class="tile"/><rect x="428" y="360" width="32" height="32" rx="9" fill="#4ade8033" stroke="#4ade8055"/><circle cx="438" cy="371" r="4" fill="none" stroke="#9df0bb" stroke-width="1.6"/><path d="M432 384c0-3 3-5 6-5s6 2 6 5" fill="none" stroke="#9df0bb" stroke-width="1.6"/><text x="470" y="375" class="ink" font-size="12.5" font-weight="640">Class Tools</text><text x="470" y="389" class="small">Picker, timer &amp; scores</text>
    <rect x="602" y="348" width="158" height="56" rx="12" class="tile"/><rect x="614" y="360" width="32" height="32" rx="9" fill="#5ad1ff33" stroke="#5ad1ff55"/><rect x="621" y="367" width="18" height="14" rx="2" fill="none" stroke="#b3ecff" stroke-width="1.6"/><text x="656" y="375" class="ink" font-size="12.5" font-weight="640">Media</text><text x="656" y="389" class="small">Image library</text>
    <rect x="44" y="414" width="174" height="56" rx="12" class="tile"/><rect x="56" y="426" width="32" height="32" rx="9" fill="#fbbf2433" stroke="#fbbf2455"/><path d="M252 430h12v20h-12z" fill="none" stroke="#ffe08a" stroke-width="1.5"/><text x="98" y="441" class="ink" font-size="12.5" font-weight="640">Notes</text><text x="98" y="455" class="small">Autosaving</text>
    <rect x="230" y="414" width="174" height="56" rx="12" class="tile"/><rect x="242" y="426" width="32" height="32" rx="9" fill="#7fd6a133" stroke="#7fd6a155"/><rect x="249" y="432" width="18" height="20" rx="2" fill="none" stroke="#b8f0cf" stroke-width="1.5"/><text x="284" y="441" class="ink" font-size="12.5" font-weight="640">Calculator</text><text x="284" y="455" class="small">Safe &amp; keyboard ready</text>
    <rect x="416" y="414" width="158" height="56" rx="12" class="tile"/><rect x="428" y="426" width="32" height="32" rx="9" fill="#9aa1c033" stroke="#9aa1c055"/><circle cx="444" cy="442" r="5" fill="none" stroke="#cfd4e6" stroke-width="1.5"/><text x="470" y="441" class="ink" font-size="12.5" font-weight="640">Settings</text><text x="470" y="455" class="small">Look, pen &amp; data</text>
  </g>
  <text x="46" y="498" class="dim" font-size="11">Everything works offline after the first visit.</text>

  <!-- mini cards -->
  <rect x="24" y="530" width="370" height="196" rx="18" class="card"/>
  <text x="46" y="556" class="title">Teaching toolbox</text>
  <g>
    <rect x="44" y="572" width="78" height="58" rx="11" class="tile"/><path d="M75 590l12 5-8 2-2 7z" fill="#b9aaff"/><text x="83" y="618" class="small" text-anchor="middle">Select</text>
    <rect x="131" y="572" width="78" height="58" rx="11" class="tile"/><path d="M160 588l14 14-6 6-14-14z" fill="#b9aaff"/><text x="170" y="618" class="small" text-anchor="middle">Pen</text>
    <rect x="218" y="572" width="78" height="58" rx="11" class="tile"/><path d="M240 592h30v8h-30z" fill="#a9f0c4"/><text x="257" y="618" class="small" text-anchor="middle">Highlight</text>
    <rect x="305" y="572" width="62" height="58" rx="11" class="tile"/><path d="M326 588l12 12-8 8-12-12z" fill="#ffb3bf"/><text x="336" y="618" class="small" text-anchor="middle">Eraser</text>
    <rect x="44" y="640" width="78" height="58" rx="11" class="tile"/><circle cx="83" cy="664" r="7" fill="none" stroke="#ff9db0" stroke-width="2"/><text x="83" y="686" class="small" text-anchor="middle">Laser</text>
    <rect x="131" y="640" width="78" height="58" rx="11" class="tile"/><circle cx="170" cy="666" r="9" fill="#ffd76e"/><text x="170" y="686" class="small" text-anchor="middle">Stickers</text>
    <rect x="218" y="640" width="78" height="58" rx="11" class="tile"/><rect x="245" y="656" width="22" height="16" rx="3" fill="none" stroke="#b3ecff" stroke-width="1.6"/><circle cx="256" cy="664" r="4" fill="#b3ecff"/><text x="257" y="686" class="small" text-anchor="middle">Camera</text>
    <rect x="305" y="640" width="62" height="58" rx="11" class="tile"/><path d="M330 660h12M336 654v12" stroke="#b9aaff" stroke-width="1.8"/><text x="336" y="686" class="small" text-anchor="middle">New page</text>
  </g>

  <rect x="410" y="530" width="370" height="196" rx="18" class="card"/>
  <text x="432" y="556" class="title">Teacher shortcuts</text>
  <g font-size="11.5">
    <text x="432" y="582" class="muted">Command palette</text><rect x="700" y="570" width="58" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="711" y="583" class="dim" font-size="9.5">Ctrl K</text>
    <text x="432" y="608" class="muted">Whiteboard</text><rect x="676" y="596" width="82" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="684" y="609" class="dim" font-size="9.5">Ctrl Shift W</text>
    <text x="432" y="634" class="muted">PDF studio</text><rect x="676" y="622" width="82" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="684" y="635" class="dim" font-size="9.5">Ctrl Shift P</text>
    <text x="432" y="660" class="muted">Pen / Highlighter</text><rect x="690" y="648" width="24" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="698" y="661" class="dim" font-size="9.5">P</text><rect x="720" y="648" width="24" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="727" y="661" class="dim" font-size="9.5">H</text>
    <text x="432" y="686" class="muted">Undo / redo</text><rect x="676" y="674" width="82" height="18" rx="5" fill="#ffffff0d" stroke="#ffffff1c"/><text x="684" y="687" class="dim" font-size="9.5">Ctrl Z / ⇧Z</text>
  </g>

  <!-- widgets -->
  <rect x="800" y="308" width="376" height="120" rx="18" class="card"/>
  <text x="822" y="334" class="title">Clock</text>
  <text x="822" y="380" class="ink" font-size="34" font-weight="740" letter-spacing="-1.2">9:41 AM</text>
  <text x="822" y="402" class="dim" font-size="12">Wednesday, 19 November</text>
  <rect x="800" y="440" width="376" height="150" rx="18" class="card"/>
  <text x="822" y="466" class="title">Quick timer</text>
  <text x="822" y="510" class="ink" font-size="30" font-weight="700" letter-spacing="-1">05:00</text>
  <rect x="822" y="528" width="54" height="28" rx="8" fill="#ffffff0f" stroke="#ffffff1c"/><text x="832" y="546" class="small">1m</text>
  <rect x="884" y="528" width="54" height="28" rx="8" fill="#ffffff0f" stroke="#ffffff1c"/><text x="894" y="546" class="small">3m</text>
  <rect x="946" y="528" width="54" height="28" rx="8" fill="#ffffff0f" stroke="#ffffff1c"/><text x="956" y="546" class="small">5m</text>
  <rect x="822" y="564" width="76" height="30" rx="9" fill="url(#accent)"/><text x="840" y="583" font-size="11.5" font-weight="650" fill="#0b0b16">Start</text>
  <rect x="800" y="602" width="376" height="124" rx="18" class="card"/>
  <text x="822" y="628" class="title">Sticky note</text>
  <rect x="822" y="640" width="332" height="66" rx="9" fill="#f6e6a1"/>
  <text x="836" y="662" font-size="12" fill="#3a2f0a">Remember: bring the geometry set for</text>
  <text x="836" y="680" font-size="12" fill="#3a2f0a">period 4 — recap fractions first.</text>

  <!-- dock -->
  <rect x="330" y="700" width="540" height="66" rx="18" fill="#151828" fill-opacity=".8" stroke="#ffffff22" filter="url(#soft)"/>
  <g>
    <rect x="348" y="716" width="34" height="34" rx="10" fill="#8b7dff33" stroke="#8b7dff66"/><path d="M357 725h16v10h-16z" fill="none" stroke="#c9c0ff" stroke-width="1.6"/><circle cx="365" cy="760" r="2" fill="#8b7dff"/>
    <rect x="410" y="716" width="34" height="34" rx="10" fill="#ff8f6b33" stroke="#ff8f6b66"/><path d="M419 724h12l4 4v12h-16z" fill="none" stroke="#ffc4b1" stroke-width="1.5"/>
    <rect x="472" y="716" width="34" height="34" rx="10" fill="#4ade8033" stroke="#4ade8066"/><circle cx="484" cy="728" r="4" fill="none" stroke="#adf3c4" stroke-width="1.6"/><path d="M478 742c0-3 3-5 6-5s6 2 6 5" fill="none" stroke="#adf3c4" stroke-width="1.6"/>
    <rect x="534" y="716" width="34" height="34" rx="10" fill="#5ad1ff33" stroke="#5ad1ff66"/><rect x="542" y="724" width="18" height="14" rx="2" fill="none" stroke="#c2f1ff" stroke-width="1.6"/>
    <rect x="658" y="716" width="34" height="34" rx="10" fill="#fbbf2433" stroke="#fbbf2466"/><path d="M667 722h14v22h-14z" fill="none" stroke="#ffe6a3" stroke-width="1.5"/>
    <rect x="720" y="716" width="34" height="34" rx="10" fill="#7fd6a133" stroke="#7fd6a166"/><rect x="727" y="722" width="20" height="22" rx="2" fill="none" stroke="#c3f2d8" stroke-width="1.5"/>
    <rect x="782" y="716" width="34" height="34" rx="10" fill="#9aa1c033" stroke="#9aa1c066"/><circle cx="799" cy="733" r="6" fill="none" stroke="#dfe3f3" stroke-width="1.5"/>
  </g>
  <g font-size="8.5" fill="#9aa1c0" text-anchor="middle">
    <text x="365" y="762">Whiteboard</text><text x="427" y="762">PDF</text><text x="489" y="762">Class</text><text x="551" y="762">Media</text><text x="675" y="762">Notes</text><text x="737" y="762">Calc</text><text x="799" y="762">Settings</text>
  </g>
</svg>
